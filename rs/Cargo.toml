[package]
name = "tabnas-transduce"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "Streaming transducers over any tabnas parser: source events, selectors, bounded captures and the table protocol."
license = "MIT"
repository = "https://github.com/tabnas/transduce"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["parser", "streaming", "transducer", "json", "csv"]
categories = ["parsing", "encoding"]

[lib]
name = "tabnas_transduce"
path = "src/lib.rs"

[dependencies]
# The engine is consumed as a SIBLING CHECKOUT, the standard tabnas
# development model: clone https://github.com/tabnas/parser next to this
# repo. The engine is published on crates.io as tabnas-parser (it keeps
# the `tabnas` name here), and the grammars under their own names; the
# release workflow rewrites these paths into requirements on their newest
# versions when it publishes this crate (admin ADR-21). tabnas-json is the
# grammar the JSON Lines source parses each line with, and tabnas-csv the
# one the CSV line source parses each chunk of records with.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
tabnas-json = { path = "../../json/rs" }
tabnas-csv = { path = "../../csv/rs" }
indexmap = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The grammars the differential suite runs every fixture through, each a
# sibling checkout like the engine.
tabnas-jsonl = { path = "../../jsonl/rs" }
tabnas-jsonic = { path = "../../jsonic/rs" }
tabnas-jsonc = { path = "../../jsonc/rs" }
tabnas-json5 = { path = "../../json5/rs" }
tabnas-yaml = { path = "../../yaml/rs" }
tabnas-toml = { path = "../../toml/rs" }
tabnas-ini = { path = "../../ini/rs" }
tabnas-xml = { path = "../../xml/rs" }
tabnas-zon = { path = "../../zon/rs" }
tabnas-markdown = { path = "../../markdown/rs" }
tabnas-feed = { path = "../../feed/rs" }
# The fleet's TSV fixture loader and runner, for the shared fixtures in
# ../test/spec that every runtime of this crate runs (rs/tests/spec_*.rs).
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "throughput"
harness = false
