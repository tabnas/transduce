# CI caller — the org-standard polyglot workflow for a ts/ + go/ repository.
# Live. Change it here, in a reviewed pull request: session credentials
# can push .github/workflows/* (admin DECISIONS.md ADR-8, as amended
# 2026-09-24). rust.yml runs the Rust gate (ci/rust/run.sh) separately.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # deps names every tabnas repository the ts/ and go/ trees depend on,
  # dependency first. debug and hoover are there although nothing here
  # imports them: ini's Go package imports both (go/go.mod records hoover
  # as indirect), and json/go/debugtest's `replace` points the workspace
  # at a ../debug clone, so without the two clones the workspace cannot
  # load ini and every test that reads an INI document fails to build.
  ci:
    uses: ./.github/workflows/polyglot-ci-trial.yml
    with:
      deps: "parser support debug json hoover jsonic csv json5 jsonc jsonl markdown toml xml yaml zon ini feed alchemy"

  # The shared workflow runs `go test ./...` with no build tags and takes
  # none as an input (its inputs are deps, build-order, run-ts, run-go,
  # node-version and go-version).
  # This module's incremental source, the rule-event adapter over the
  # engine's node-cell identity, and the differential suite that verifies
  # each grammar for it, compile only under the `tabnas_nodecell` build
  # tag (go/doc.go). Without it 30 of the module's 124 tests do not exist
  # and 158 fixture subtests skip (measured on 2026-10-03: 94 tests, 158
  # skips without the tag; 124 tests, 4 skips with it), so the adapter
  # itself would never run in CI.
  # The maintainer's decision is that the tag is on in CI, so this job
  # runs the suite once more with it: a caller-side job on the precedent
  # of support's go-adder, not a fork of the shared workflow, with the
  # same checkout, sibling clones and go.work its go job builds. When
  # polyglot-ci.yml gains a build-tags input this job becomes that input
  # (admin#97).
  ci-all-from-source:
    uses: ./.github/workflows/polyglot-ci-trial.yml
    with:
      deps: "parser support debug json hoover jsonic csv json5 jsonc jsonl markdown toml xml yaml zon ini feed alchemy"
      skip-released: false
      run-go: false

  go-nodecell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: transduce

      # cache: false, as in support's job: setup-go looks for go.mod in
      # $GITHUB_WORKSPACE, non-recursively, and the checkout is one level
      # down, so the cache step would warn on every run.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      # The same siblings the shared go job clones (the deps input above).
      - name: Clone tabnas dependencies
        shell: bash
        run: |
          set -e
          for dep in parser support debug json hoover jsonic csv json5 jsonc jsonl markdown toml xml yaml zon ini feed alchemy; do
            git clone --depth 1 "https://github.com/tabnas/$dep.git" "$dep"
          done

      # Mirrors the shared workflow's go job: a workspace over every module
      # in the tree, so the suite runs against sibling source.
      - name: Set up go workspace
        shell: bash
        run: |
          set -e
          go work init
          for gm in $(find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*'); do
            go work use "$(dirname "$gm")"
          done

      - name: Build with the tag
        working-directory: transduce/go
        run: go build -tags tabnas_nodecell ./...

      - name: Vet and test with the tag
        working-directory: transduce/go
        run: |
          go vet -tags tabnas_nodecell ./...
          go test -tags tabnas_nodecell -v ./...
