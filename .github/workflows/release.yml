# Target: tabnas/transduce -> .github/workflows/release.yml
#
# Publishes @tabnas/transduce to npm via GitHub OIDC Trusted Publishing (no
# token), and writes the release tags. The fleet-standard TOOL shape
# (admin ADR-20) — see lsp__release.yml in admin's rollout/workflows/,
# where the reasoning is worked through at length.
#
# TWO TRIGGERS:
#   workflow_dispatch  the normal path. Bump in a reviewed PR first;
#                      this run reads main, publishes it, tags it. The
#                      workflow never commits.
#   push: ts/v*        the orchestrator path — admin/publish.sh pushes
#                      the tag itself, so the tag steps no-op.
#
# npm allows exactly ONE workflow file per trusted publisher, so the
# tagging has to live in this file rather than a workflow of its own; an
# OIDC token from an unregistered workflow is refused as 404 (not 403,
# so as not to leak whether a package exists). Renaming this file breaks
# publishing until the npm-side entry is updated to match.
#
# TWO CREDENTIALS, NEITHER ABLE TO DO THE OTHER'S JOB: id-token: write
# is OIDC, exchanged AT NPM, and cannot create a tag — its audience is
# the registry, not GitHub. contents: write is the per-run GITHUB_TOKEN
# and writes the tags. They cannot be split across workflows either: a
# ref pushed with GITHUB_TOKEN does not start another run, so "tag in A,
# publish on the tag" would publish nothing, silently.
#
# They ARE split across jobs. publish-npm runs `npm i`, and with it the
# lifecycle scripts of devDependencies resolved from the registry ("*",
# unpinned), so it holds the OIDC credential and nothing that can write
# the repository: its token is contents: read, and its checkout persists
# no credential. The tag job installs nothing, and holds contents: write.
#
# ONE VERSION. ts/package.json is what this workflow reads, and it must
# equal the VERSION consts in ts/src/transduce.ts and go/doc.go and the
# [package] version in rs/Cargo.toml: ts/test/version.test.ts and
# go/version_test.go fail the bump PR when they drift, and
# crates-release.yml refuses a tag whose crate and package disagree.
#
# NO TEST STEP. The build runs, against already-published dependency
# versions (every @tabnas devDependency is "*", resolved from the
# registry), so a failing build never publishes; ci.yml gates the bump
# PR across the full matrix. The build resolves @tabnas/alchemy from the
# registry, whose shared types the source imports, so alchemy is released
# before transduce (admin publish.sh ORDER).
#
# THE FIRST PUBLISH IS THE MAINTAINER'S, BY HAND. npm registers a trusted
# publisher only for a package that already exists, so @tabnas/transduce
# first reaches the registry through a maintainer's `npm publish` of the
# bump commit (admin rollout/setup-npm-trusted-publishing.sh). This
# workflow then fails open on the version already on npm, and does the
# rest: the tags, the GitHub Release and the crates.io publish.
#
# Go modules are served by proxy.golang.org straight from the go/v* tag:
# PUSHING THE TAG IS THE RELEASE, and it cannot be undone — the proxy
# caches module versions immutably. A go/vX.Y.Z naming the wrong commit
# is permanent; bump to the next patch rather than moving it.
#
# THE GITHUB RELEASE (ADR-19). Once the release tag is on the remote, the
# github-release job calls github-release.yml, which creates a notes-only
# GitHub Release on it: go/v<version>, or ts/v<version> where there is no
# Go module. So a dispatch ships npm, the Go module and the Release
# together. It is a reusable-workflow call because a Release created with
# GITHUB_TOKEN starts no workflow run. A failed Release unpublishes
# nothing; dispatch github-release.yml with the tag to finish it.
#
# CRATES.IO (ADR-21). Where the repository has a
# Rust crate, the crates job hands the same release tag to
# crates-release.yml, which publishes rs/ to crates.io from that tag over
# OIDC trusted publishing. Its trusted publisher on crates.io names
# THIS file. crates.io matches the top-level workflow (the OIDC
# workflow_ref), not the called one, so renaming release.yml breaks
# crates.io as it breaks npm. No job needs the crates job, so a failed
# crates publish blocks nothing and unpublishes nothing. Re-run that job
# to repair it.
#
# Actions are pinned to full commit SHAs with the corresponding release
# as a trailing comment, at the action's latest release
# (ADR-16).

name: release

on:
  workflow_dispatch:
    inputs:
      go:
        description: 'Also tag the Go module (go/v<version>)'
        type: boolean
        default: true
  push:
    tags:
      - 'ts/v*'

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC -> npm; cannot write refs
      contents: read    # the checkout; the tag job writes the tags
    outputs:
      version: ${{ steps.v.outputs.version }}
      missing: ${{ steps.tags.outputs.missing }}
      anchor: ${{ steps.tags.outputs.anchor }}
    steps:
      # persist-credentials: false, because `npm i` below runs the lifecycle
      # scripts of registry-resolved devDependencies: nothing they run may
      # find a credential that writes the repository (see the header).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # tags, for the already-released guard
          persist-credentials: false

      # ADR-20: only a COMPONENT or a TOOL publishes. The repository's kind
      # is committed in .tabnas-kind (COMPONENT, TOOL, CONTENT or ADMIN), so
      # this workflow refuses to run in a repository that does not publish.
      - name: Refuse unless this repository publishes (COMPONENT or TOOL)
        run: |
          K="$(tr -d '[:space:]' < .tabnas-kind 2>/dev/null || true)"
          case "$K" in
            COMPONENT|TOOL) echo "kind: $K" ;;
            *) echo "::error::.tabnas-kind is '${K:-missing}', and only a COMPONENT or a TOOL publishes (admin ADR-20)"; exit 1 ;;
          esac

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read the version
        id: v
        run: |
          V="$(node -p "require('./ts/package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V"

      # A dispatch is NOT inherently tied to the default branch — the ref
      # is a parameter, so dispatching a version-bump feature branch would
      # publish an immutable npm version and immutable tags from an
      # unreviewed commit. Refuse anything but main.
      - name: Refuse a dispatch from anywhere but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::release must be dispatched from main (got ${{ github.ref }})"
          exit 1

      # A pushed tag names the source it releases, so it must be the tag of
      # the version that source declares. ts/v0.1.2 pushed at a 0.1.1
      # commit would otherwise publish 0.1.1 and leave ts/v0.1.2 naming the
      # wrong source for good.
      - name: Refuse a pushed tag that is not this version's
        if: github.event_name == 'push'
        run: |
          V="${{ steps.v.outputs.version }}"
          if [ "${GITHUB_REF_NAME#ts/v}" != "$V" ]; then
            echo "::error::the pushed tag $GITHUB_REF_NAME is not ts/v$V, the tag of the version its ts/package.json declares"
            exit 1
          fi

      # Which tags this run still has to create. Fails closed only when
      # there is NOTHING left to do, which is the real "you forgot to
      # bump" signal; a run that has ts/v but is missing go/v is a
      # half-finished release and must be repairable, not refused.
      - name: Decide which tags this run must create
        id: tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ steps.v.outputs.version }}"
          MISSING=""; ANCHOR=""
          for T in "ts/v$V" "go/v$V"; do
            if C="$(git rev-parse -q --verify "refs/tags/$T^{commit}")"; then
              [ -n "$ANCHOR" ] || ANCHOR="$C"
            else
              # go: false suppresses only the creation of a missing Go tag.
              # An existing one still anchors the repair: skipping it would
              # put ts/v on HEAD while the Release and the crate came from
              # the commit go/v names.
              case "$T" in
                go/*) [ "${{ inputs.go }}" = "true" ] || continue ;;
              esac
              MISSING="$MISSING $T"
            fi
          done
          MISSING="$(echo $MISSING)"
          if [ -z "$MISSING" ]; then
            echo "::error::every tag this run would create already exists — bump the version first"
            exit 1
          fi

          # A REPAIR must name the commit the release actually happened at,
          # not whatever main has become since. If ts/v landed and go/v did
          # not, and main moved on, tagging HEAD would leave the two tags
          # identifying DIFFERENT commits — permanent for the Go module,
          # because proxy.golang.org caches module versions immutably.
          HEAD_C="$(git rev-parse HEAD)"
          if [ -z "$ANCHOR" ]; then
            # No tag records the release commit. If npm already has the
            # version (a run that published and then lost its tag push, or
            # the maintainer's first publish), npm's gitHead, the commit its
            # tarball was built from, is the only record of it: tag HEAD only
            # if it is that commit, or once main has moved on the tags would
            # name a commit npm never served.
            if npm view "@tabnas/transduce@$V" version >/dev/null 2>&1; then
              GH="$(npm view "@tabnas/transduce@$V" gitHead 2>/dev/null || true)"
              if [ -z "$GH" ]; then
                echo "::error::$V is on npm, no tag names it, and npm records no gitHead for it, so nothing says which commit it was built from — tag that commit by hand, or bump the version"
                exit 1
              elif [ "$GH" != "$HEAD_C" ]; then
                echo "::error::$V is on npm, built from $GH, and no tag names it; HEAD is $HEAD_C, so tagging it would name a commit npm never served — tag $GH by hand, or bump the version"
                exit 1
              fi
              echo "$V is on npm, built from HEAD ($GH): tagging it"
            fi
            ANCHOR="$HEAD_C"
          elif [ "$ANCHOR" != "$HEAD_C" ]; then
            if ! npm view "@tabnas/transduce@$V" version >/dev/null 2>&1; then
              echo "::error::$V is tagged at $ANCHOR but is not on npm — publishing would ship HEAD while the tags name an older commit; resolve by hand"
              exit 1
            fi
            echo "repairing an earlier release: anchoring to $ANCHOR (HEAD has moved on)"
          fi
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "anchor=$ANCHOR" >> "$GITHUB_OUTPUT"
          echo "will create:$MISSING at $ANCHOR"

      # Fails OPEN: the REGISTRY, not the tag, decides whether a version
      # is released. A run can publish and then fail before tagging;
      # without this the re-run dies on "cannot publish over the
      # previously published versions" before reaching the tag steps.
      - name: Publish to npm if the version is missing (OIDC)
        working-directory: ts
        run: |
          V="${{ steps.v.outputs.version }}"
          npm install -g npm@latest
          if npm view "@tabnas/transduce@$V" version >/dev/null 2>&1; then
            echo "@tabnas/transduce@$V is already on npm — skipping publish"
          else
            npm i
            npm run build --if-present
            npm publish --access public
          fi

  # The tags, in a job of their own: the one job whose token can write
  # refs, and it installs and runs nothing from the registry. Its checkout
  # keeps the default persisted credential, which `git push` and
  # `git ls-remote` below authenticate with.
  tag:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GITHUB_TOKEN -> tags; cannot publish
    outputs:
      release-tag: ${{ steps.reltag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # every tag, and the older commit a repair anchors to

      # After publishing, so a tag only ever exists for a release that
      # reached the registry.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # ONE atomic transaction, not a push per tag. Pushed separately,
          # ts/v could land and go/v fail on a transient error, leaving npm
          # published, ts/v tagged and the Go module unreleased — and
          # publish-npm's tag guard would then refuse every re-dispatch, so
          # the half-release could never be repaired.
          for T in ${{ needs.publish-npm.outputs.missing }}; do
            git tag "$T" "${{ needs.publish-npm.outputs.anchor }}"
          done
          git push --atomic origin ${{ needs.publish-npm.outputs.missing }}

      # ADR-19: hand the release tag to the github-release job. Read from
      # the REMOTE, not from the step above: a push-path run tagged nothing
      # itself.
      - name: Hand the release tag to the GitHub Release
        id: reltag
        run: |
          V="${{ needs.publish-npm.outputs.version }}"
          # go/v wherever there is a Go module, never ts/v: otherwise a
          # go: false dispatch and its go: true repair would leave two
          # Releases for one version.
          if [ -f go/go.mod ]; then T="go/v$V"; else T="ts/v$V"; fi
          # The tag must name the commit this run released: the anchor on a
          # dispatch, the pushed tag's commit on a push. A tag naming another
          # commit (a go/v pushed somewhere else) would ship the rest of the
          # release from a source npm never served, so it is handed to no
          # job. An annotated tag is listed twice, the second time as $T^{}
          # with its commit, so the last line is the commit either way.
          WANT="${{ needs.publish-npm.outputs.anchor }}"
          [ -n "$WANT" ] || WANT="$(git rev-parse HEAD)"
          C="$(git ls-remote --tags origin "refs/tags/$T" "refs/tags/$T^{}" | tail -n1 | cut -f1)"
          if [ -z "$C" ]; then
            echo "::notice::$T is not on the remote — no GitHub Release this run; dispatch github-release.yml with it once it is"
          elif [ "$C" != "$WANT" ]; then
            echo "::error::$T is at $C, but this run released $WANT, so nothing more is released from $T — leave it where it is and release the next patch with every tag on one commit"
            exit 1
          else
            echo "tag=$T" >> "$GITHUB_OUTPUT"
          fi

  # The GitHub Release (ADR-19; see the header).
  github-release:
    needs: tag
    if: ${{ needs.tag.outputs.release-tag != '' }}
    permissions:
      contents: write   # GITHUB_TOKEN -> the Release
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ needs.tag.outputs.release-tag }}

  # crates.io (ADR-21; see the header).
  crates:
    needs: tag
    if: ${{ needs.tag.outputs.release-tag != '' }}
    permissions:
      contents: read    # the tagged source
      id-token: write   # OIDC -> crates.io (a called job gets no more than this)
    uses: ./.github/workflows/crates-release.yml
    with:
      tag: ${{ needs.tag.outputs.release-tag }}
